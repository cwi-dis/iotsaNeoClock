; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs =
   nodemcuv2
;   crowpanel128

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = https://github.com/cwi-dis/iotsa.git#develop
build_flags =
monitor_speed = 115200
; upload_port = neoclock.local

[esp8266]
extends = common
platform = espressif8266
board_build.ldscript = eagle.flash.4m3m.ld
; WITH_BUIENRADAR here relies on cwi-dis/iotsa#198's MFLN small-buffer
; mitigation for an earlier OOM crash (fingerprint-pinned TLS with BearSSL's
; 16KB default buffers didn't fit in ESP8266's free heap). Verified working
; against a real deployed clock, but the margin is tight (only ~28KB free
; heap to begin with) and a one-off freeze was observed once -- keep an eye
; on it. See cwi-dis/iotsaNeoClock#7.
build_flags = ${common.build_flags} -DWITH_NEOPIXEL_DISPLAY -DWITH_BUIENRADAR

; ESP32-C3, external CH340 USB-UART bridge (not native USB-CDC) -- do not add
; -DARDUINO_USB_MODE/-DARDUINO_USB_CDC_ON_BOOT here, unlike iotsa's own generic
; [esp32c3] section. See doc/board-elecrow-crowpanel-1.28.md.
;
; WITH_BUIENRADAR (rain-forecast display, #7) is enabled here -- unlike
; ESP8266, RAM headroom for the HTTPS/TLS fetch isn't a concern on ESP32.
[esp32c3]
extends = common
platform = espressif32
build_flags = ${common.build_flags} -DWITH_ROUNDLCD_DISPLAY -DWITH_BUIENRADAR
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX
board_build.mcu = esp32c3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

[env:nodemcuv2]
extends = esp8266
board = nodemcuv2

[env:crowpanel128]
extends = esp32c3
board = esp32-c3-devkitm-1
