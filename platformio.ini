; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs = iotsa_v4
; Board definitions (platform, board, USB wiring, -DESP32C3, NimBLE lib_ignore)
; are vendored verbatim from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the header
; of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency is
; bumped; do not hand-edit. App-specific choices -- feature flags, extra
; libraries -- stay in the [env:*] sections below.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
build_flags =
lib_deps = https://github.com/cwi-dis/iotsa.git#develop
monitor_speed = 115200
; upload_port = neoclock.local

; iotsa_v4 board = ESP8266 (nodemcuv2). No board_build.ldscript override: the
; nodemcuv2 default (eagle.flash.4m1m.ld) keeps a ~1MB OTA slot, which the old
; 4m3m override sacrificed for a 3MB filesystem the clock never needed (it uses
; ~15KB of LittleFS for alert patterns). WITH_BUIENRADAR relies on
; cwi-dis/iotsa#198's MFLN small-buffer mitigation for an earlier ESP8266 OOM
; crash -- the free-heap margin is tight (~28KB), keep an eye on it, see
; cwi-dis/iotsaNeoClock#7.
[env:iotsa_v4]
extends = iotsa_v4
build_flags = ${common.build_flags} -DWITH_NEOPIXEL_DISPLAY -DWITH_BUIENRADAR

; crowpanel128 board = Elecrow CrowPanel ESP32-C3 1.28" round LCD. iotsa's
; [crowpanel128] extends the _esp32c3_extusb trait (external CH340 USB-UART, not
; native USB-CDC), so it correctly omits -DARDUINO_USB_MODE/-DARDUINO_USB_CDC_ON_BOOT
; and just adds -DESP32C3. See doc/board-elecrow-crowpanel-1.28.md.
[env:crowpanel128]
extends = crowpanel128
build_flags = ${_esp32c3_extusb.build_flags} -DWITH_ROUNDLCD_DISPLAY -DWITH_BUIENRADAR
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX
