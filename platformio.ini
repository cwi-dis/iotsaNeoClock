; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs =
   nodemcuv2
;   esp32thing
;   crowpanel128

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = https://github.com/cwi-dis/iotsa.git#develop
build_flags =
monitor_speed = 115200
; upload_port = neoclock.local

[esp8266]
extends = common
platform = espressif8266
board_build.ldscript = eagle.flash.4m3m.ld
build_flags = ${common.build_flags} -DWITH_NEOPIXEL_DISPLAY

[esp32]
extends = common
platform = espressif32
build_flags = ${common.build_flags} -DWITH_NEOPIXEL_DISPLAY -DWITH_BUIENRADAR
board_build.partitions = min_spiffs.csv

; ESP32-C3, external CH340 USB-UART bridge (not native USB-CDC) -- do not add
; -DARDUINO_USB_MODE/-DARDUINO_USB_CDC_ON_BOOT here, unlike iotsa's own generic
; [esp32c3] section. See doc/board-elecrow-crowpanel-1.28.md.
;
; WITH_BUIENRADAR (rain-forecast display, #7) is enabled on both ESP32 envs --
; unlike ESP8266, RAM headroom for the HTTPS/TLS fetch isn't a concern here.
[esp32c3]
extends = common
platform = espressif32
build_flags = ${common.build_flags} -DWITH_ROUNDLCD_DISPLAY -DWITH_BUIENRADAR
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX
board_build.mcu = esp32c3
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

[env:nodemcuv2]
extends = esp8266
board = nodemcuv2

[env:esp32thing]
extends = esp32
board = esp32thing

[env:crowpanel128]
extends = esp32c3
board = esp32-c3-devkitm-1
